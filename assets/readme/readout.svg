<g font-size="13" fill="#242b25"><text x="668" y="84">The public page browses metadata.</text><text x="668" y="105">Playback and account data stay</text><text x="668" y="126">on your own backend instance.</text><text x="668" y="153">Keep access to trusted devices.</text></g>
