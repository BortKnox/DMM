<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 214" width="960" height="214" role="img" aria-labelledby="title desc">
<title id="title">DMM specification readout. Unit 03, personal media workbench.</title>
<desc id="desc">React, FastAPI, MongoDB and FFmpeg. Browser, Harbor, Stremio and native players. Active development for a trusted local instance. Public catalogue preview, private playback and account data.</desc>
