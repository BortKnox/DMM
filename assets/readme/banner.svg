<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-labelledby="title desc">
<title id="title">DMM / Debrid Media Manager. A personal screening room.</title>
<desc id="desc">Unit 03 of the Bort Knox workshop. A personal media workbench for discovery, source selection and playback. Warm paper, orange controls and a small media deck.</desc>
